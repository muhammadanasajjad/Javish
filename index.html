<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Javish Interpreter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/assets/logo.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/vis-network/styles/vis-network.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vis-network/dist/vis-network.min.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=play_arrow"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_tree,arrow_back_ios,article,close,code"
    />
  </head>
  <body>
    <div id="sidebar" class="sidebar">
      <div class="title-card">
        <div class="title-container">
          <img
            src="/assets/logo.svg"
            alt="Logo"
            class="logo"
            width="32px"
            height="32px"
          />
          <h1>Javish Interpreter</h1>
        </div>
        <button id="toggle-docs" class="toggle-docs">
          <span class="material-symbols-outlined"> article </span>
        </button>
      </div>
      <h2 class="non-docs">Tokens</h2>
      <div id="tokens" class="panel non-docs"></div>
      <h2 class="non-docs">Parsed Tree (AST)</h2>
      <div id="ast" class="panel non-docs"></div>
      <div id="docs" class="panel docs">
        <div id="docs-content" class="markdown"></div>
      </div>
    </div>
    <div id="divider"></div>
    <div class="main">
      <div class="editorWrapper">
        <div class="lineNumbers" id="lineNumbers"></div>
        <pre id="highlighted"></pre>
        <textarea spellcheck="false" id="editor"></textarea>
      </div>
      <div class="resizable-vertical" id="bottomPanel">
        <div class="resizer-vertical" id="resizerVertical"></div>
        <div class="controls">
          <button id="runBtn">
            <span class="material-symbols-rounded">play_arrow</span>Run
          </button>
          <button id="clearBtn">Clear</button>
        </div>
        <div id="output"></div>
      </div>
      <div id="presets">
        <div class="preset-header">
          <h2>Presets</h2>
          <button id="preset-close">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
      </div>
      <button id="preset-open">
        <span class="material-symbols-outlined">arrow_back_ios</span>
      </button>
    </div>
    <script src="js/presets.js"></script>
    <script src="js/tokenise.js"></script>
    <script src="js/parse.js"></script>
    <script src="js/run.js"></script>
    <script src="js/ioHandler.js"></script>
    <script src="js/main.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";

      const firebaseConfig = {
        apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
        authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
        projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
        storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
        messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
        appId: import.meta.env.VITE_FIREBASE_APP_ID,
      };

      export const app = initializeApp(firebaseConfig);
    </script>
  </body>
</html>
